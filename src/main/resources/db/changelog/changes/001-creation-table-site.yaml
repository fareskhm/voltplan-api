databaseChangeLog:
  - changeSet:
      id: 001-creation-table-site
      author: fares
      changes:
        - createTable:
            tableName: site
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(30)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_site_code
              - column:
                  name: nom
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: filiere
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: region
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: puissance_installee_mw
                  type: numeric(10,2)
                  constraints:
                    nullable: false