services:
  postgres:
    image: postgres:16.3
    container_name: voltplan-db
    environment:
      POSTGRES_DB: voltplan
      POSTGRES_USER: voltplan
      POSTGRES_PASSWORD: voltplan
    ports:
      - "5432:5432"
    volumes:
      - voltplan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltplan -d voltplan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  voltplan-data: